version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - bodyclose
    - noctx
    - unconvert
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - noctx

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jooservices/go-jabledownloader

run:
  timeout: 3m
