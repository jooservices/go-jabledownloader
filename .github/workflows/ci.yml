# Dedicated CI for jooservices/go-jabledownloader — GitHub-hosted runners
# Pull-request quality gate: full pipeline. Post-merge heads run ci-post-merge.yml.
# No Codecov/SonarQube: not yet provisioned for this repo.
name: CI

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Cache Go caches
        uses: actions/cache@v6
        id: go-cache
        with:
          path: .cache
          key: go-cache-v2-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-v2-

      - name: Download modules
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm go go mod download

      - name: Format check
        run: tools/ci/docker-compose run --rm go make fmt-check

      - name: Module integrity
        run: tools/ci/docker-compose run --rm go go mod verify

  lint:
    name: Lint
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Cache Go caches
        uses: actions/cache@v6
        id: go-cache
        with:
          path: .cache
          key: go-cache-v2-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-v2-

      - name: Download modules
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm go go mod download

      - name: Vet
        run: tools/ci/docker-compose run --rm go make vet

      - name: Lint
        run: tools/ci/docker-compose run --rm go make lint

  security:
    name: Security (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Dependencies
          - name: Secrets
          - name: SAST
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build CI image
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose build go

      - name: Govulncheck
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose run --rm go govulncheck ./...

      - name: OSV Scanner
        if: matrix.name == 'Dependencies'
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            .

      - name: Dependency Review
        if: matrix.name == 'Dependencies'
        uses: actions/dependency-review-action@v5

      - name: Gitleaks OSS CLI
        if: matrix.name == 'Secrets'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --redact --exit-code 1

      - name: Semgrep (OSS)
        if: matrix.name == 'SAST'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
            semgrep scan --config p/golang --error

  test:
    name: Test
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Cache Go caches
        uses: actions/cache@v6
        id: go-cache
        with:
          path: .cache
          key: go-cache-v2-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-v2-

      - name: Download modules
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm go go mod download

      - name: Run tests with coverage
        run: tools/ci/docker-compose run --rm go go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: build/coverage

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Enforce coverage floor
        run: |
          total="$(tools/ci/docker-compose run --rm go sh -c 'go tool cover -func=build/coverage/coverage.out' | awk '/^total:/{gsub(/%/,"",$NF); print $NF}')"
          echo "Total coverage: ${total}%"
          # Interim floor while test coverage grows; raise toward 85% target.
          awk -v total="${total}" -v floor=25 'BEGIN {
            if (total < floor) {
              printf "FAIL: coverage %.1f%% is below the %.1f%% floor\n", total, floor
              exit 1
            }
            printf "PASS: coverage %.1f%% meets the %.1f%% floor\n", total, floor
          }'

  ci:
    name: CI
    needs: [validate, lint, security, test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !cancelled() }}
    steps:
      - name: Aggregate CI result
        run: |
          for result in \
            "${{ needs.validate.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.coverage.result }}"; do
            if [ "${result}" != "success" ]; then
              echo "CI failed: one or more required jobs did not succeed"
              exit 1
            fi
          done
          echo "CI passed"