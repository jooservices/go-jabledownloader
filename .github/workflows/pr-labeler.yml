name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-label PR
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Repair workspace permissions
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          repo_dir="${RUNNER_WORKSPACE:-}/${GITHUB_REPOSITORY##*/}"

          if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}" ]; then
            echo "Reclaiming ${RUNNER_WORKSPACE} ..."
            sudo chown -R "${runner_uid}:${runner_gid}" "${RUNNER_WORKSPACE}"
          fi

          if [ -d "${repo_dir}" ]; then
            echo "Removing Docker artifacts under ${repo_dir} ..."
            sudo rm -rf \
              "${repo_dir}/.cache" \
              "${repo_dir}/bin" \
              "${repo_dir}/dist" \
              "${repo_dir}/coverage.out"
            sudo chown -R "${runner_uid}:${runner_gid}" "${repo_dir}"
          fi

          if [ -n "${RUNNER_WORKSPACE:-}" ]; then
            work_root="$(dirname "${RUNNER_WORKSPACE}")"
            if [ -d "${work_root}/_temp" ]; then
              echo "Reclaiming ${work_root}/_temp ..."
              sudo chown -R "${runner_uid}:${runner_gid}" "${work_root}/_temp"
              sudo rm -rf "${work_root}/_temp/pr-diff-range"
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Label PR
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}