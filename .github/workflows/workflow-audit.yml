name: Workflow audit

on:
  push:
    branches: [master, develop]
    paths:
      - '.github/**'
  pull_request:
    branches: [master, develop]
    paths:
      - '.github/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: runner1-go-jabledownloader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Repair workspace permissions
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          repo_dir="${RUNNER_WORKSPACE:-}/${GITHUB_REPOSITORY##*/}"

          if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}" ]; then
            echo "Reclaiming ${RUNNER_WORKSPACE} ..."
            sudo chown -R "${runner_uid}:${runner_gid}" "${RUNNER_WORKSPACE}"
          fi

          if [ -d "${repo_dir}" ]; then
            echo "Removing Docker artifacts under ${repo_dir} ..."
            sudo rm -rf \
              "${repo_dir}/.cache" \
              "${repo_dir}/bin" \
              "${repo_dir}/dist" \
              "${repo_dir}/coverage.out"
            sudo chown -R "${runner_uid}:${runner_gid}" "${repo_dir}"
          fi

          if [ -n "${RUNNER_WORKSPACE:-}" ]; then
            work_root="$(dirname "${RUNNER_WORKSPACE}")"
            if [ -d "${work_root}/_temp" ]; then
              echo "Reclaiming ${work_root}/_temp ..."
              sudo chown -R "${runner_uid}:${runner_gid}" "${work_root}/_temp"
              sudo rm -rf "${work_root}/_temp/pr-diff-range"
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color

  zizmor:
    name: Zizmor
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Repair workspace permissions
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          repo_dir="${RUNNER_WORKSPACE:-}/${GITHUB_REPOSITORY##*/}"

          if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}" ]; then
            echo "Reclaiming ${RUNNER_WORKSPACE} ..."
            sudo chown -R "${runner_uid}:${runner_gid}" "${RUNNER_WORKSPACE}"
          fi

          if [ -d "${repo_dir}" ]; then
            echo "Removing Docker artifacts under ${repo_dir} ..."
            sudo rm -rf \
              "${repo_dir}/.cache" \
              "${repo_dir}/bin" \
              "${repo_dir}/dist" \
              "${repo_dir}/coverage.out"
            sudo chown -R "${runner_uid}:${runner_gid}" "${repo_dir}"
          fi

          if [ -n "${RUNNER_WORKSPACE:-}" ]; then
            work_root="$(dirname "${RUNNER_WORKSPACE}")"
            if [ -d "${work_root}/_temp" ]; then
              echo "Reclaiming ${work_root}/_temp ..."
              sudo chown -R "${runner_uid}:${runner_gid}" "${work_root}/_temp"
              sudo rm -rf "${work_root}/_temp/pr-diff-range"
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          format: sarif
          output: zizmor.sarif

      - name: Upload zizmor SARIF
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor