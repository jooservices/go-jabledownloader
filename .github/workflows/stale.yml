name: Stale

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Run stale bot
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,dependencies
          exempt-pr-labels: pinned,security,dependencies
          stale-issue-message: >
            This issue has been inactive for 60 days and will be closed in 14 days
            unless there is new activity.
          stale-pr-message: >
            This pull request has been inactive for 60 days and will be closed in 14 days
            unless there is new activity.
          close-issue-message: Closed due to prolonged inactivity.
          close-pr-message: Closed due to prolonged inactivity.