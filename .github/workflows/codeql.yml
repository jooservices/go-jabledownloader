name: CodeQL

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  analyze-actions:
    name: Analyze GitHub Actions
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: ./.github/actions/repair-workspace

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          db-location: ${{ runner.temp }}/codeql_db_actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-go:
    name: Analyze Go
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: ./.github/actions/repair-workspace

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Extract Go toolchain
        run: |
          docker create --name go-toolchain-src golang:1.26-bookworm
          docker cp go-toolchain-src:/usr/local/go "$RUNNER_TEMP/go-toolchain"
          docker rm go-toolchain-src
          echo "$RUNNER_TEMP/go-toolchain/bin" >> "$GITHUB_PATH"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-cache" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/go-build-cache" >> "$GITHUB_ENV"

      - name: Download modules
        run: go mod download

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          db-location: ${{ runner.temp }}/codeql_db_go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
