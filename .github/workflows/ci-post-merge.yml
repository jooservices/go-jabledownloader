# Dedicated CI for jooservices/go-jabledownloader — self-hosted runner1 (Linux X64)
# Post-merge sanity run on master/develop heads. Full gate lives in ci.yml (pull requests).
# No Codecov/SonarQube: not yet provisioned for this repo.
name: CI post-merge

on:
  push:
    branches: [master, develop]

concurrency:
  group: ci-post-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Repair workspace permissions
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}" ]; then
            echo "Reclaiming ${RUNNER_WORKSPACE} ..."
            sudo chown -R "${runner_uid}:${runner_gid}" "${RUNNER_WORKSPACE}"
          fi
          if [ -n "${RUNNER_WORKSPACE:-}" ]; then
            work_root="$(dirname "${RUNNER_WORKSPACE}")"
            if [ -d "${work_root}/_temp" ]; then
              echo "Reclaiming ${work_root}/_temp ..."
              sudo chown -R "${runner_uid}:${runner_gid}" "${work_root}/_temp"
              sudo rm -rf "${work_root}/_temp/pr-diff-range"
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Cache Go caches
        uses: actions/cache@v6
        id: go-cache
        with:
          path: .cache
          key: go-cache-v2-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-v2-

      - name: Download modules
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm go go mod download

      - name: Format check
        run: tools/ci/docker-compose run --rm go make fmt-check

      - name: Module integrity
        run: tools/ci/docker-compose run --rm go go mod verify

  test:
    name: Test
    needs: [validate]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Repair workspace permissions
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}" ]; then
            echo "Reclaiming ${RUNNER_WORKSPACE} ..."
            sudo chown -R "${runner_uid}:${runner_gid}" "${RUNNER_WORKSPACE}"
          fi
          if [ -n "${RUNNER_WORKSPACE:-}" ]; then
            work_root="$(dirname "${RUNNER_WORKSPACE}")"
            if [ -d "${work_root}/_temp" ]; then
              echo "Reclaiming ${work_root}/_temp ..."
              sudo chown -R "${runner_uid}:${runner_gid}" "${work_root}/_temp"
              sudo rm -rf "${work_root}/_temp/pr-diff-range"
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Cache Go caches
        uses: actions/cache@v6
        id: go-cache
        with:
          path: .cache
          key: go-cache-v2-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-v2-

      - name: Download modules
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm go go mod download

      - name: Run tests with coverage
        run: tools/ci/docker-compose run --rm go go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-post-merge
          path: coverage.out
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: [test]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Repair workspace permissions
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}" ]; then
            echo "Reclaiming ${RUNNER_WORKSPACE} ..."
            sudo chown -R "${runner_uid}:${runner_gid}" "${RUNNER_WORKSPACE}"
          fi
          if [ -n "${RUNNER_WORKSPACE:-}" ]; then
            work_root="$(dirname "${RUNNER_WORKSPACE}")"
            if [ -d "${work_root}/_temp" ]; then
              echo "Reclaiming ${work_root}/_temp ..."
              sudo chown -R "${runner_uid}:${runner_gid}" "${work_root}/_temp"
              sudo rm -rf "${work_root}/_temp/pr-diff-range"
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-post-merge
          path: build/coverage

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Enforce coverage floor
        run: |
          total="$(tools/ci/docker-compose run --rm go sh -c 'go tool cover -func=build/coverage/coverage.out' | awk '/^total:/{gsub(/%/,"",$NF); print $NF}')"
          echo "Total coverage: ${total}%"
          # Interim floor while test coverage grows; raise toward 85% target.
          awk -v total="${total}" -v floor=25 'BEGIN {
            if (total < floor) {
              printf "FAIL: coverage %.1f%% is below the %.1f%% floor\n", total, floor
              exit 1
            }
            printf "PASS: coverage %.1f%% meets the %.1f%% floor\n", total, floor
          }'