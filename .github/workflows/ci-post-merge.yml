# Dedicated CI for jooservices/go-jabledownloader — self-hosted runner1 (Linux X64)
# Post-merge sanity run on master/develop heads. Full gate lives in ci.yml (pull requests).
# No Codecov/SonarQube: not yet provisioned for this repo.
name: CI post-merge

on:
  push:
    branches: [master, develop]

concurrency:
  group: ci-post-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, Linux, X64]
    container: golang:1.26-bookworm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules
        uses: actions/cache@v6
        id: go-cache
        with:
          path: /go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-

      - name: Download modules
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: go mod download

      - name: Format check
        run: make fmt-check

      - name: Module integrity
        run: go mod verify

  test:
    name: Test
    needs: [validate]
    runs-on: [self-hosted, Linux, X64]
    container: golang:1.26-bookworm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules
        uses: actions/cache@v6
        id: go-cache
        with:
          path: /go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-

      - name: Download modules
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: go mod download

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-post-merge
          path: coverage.out
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: [test]
    runs-on: [self-hosted, Linux, X64]
    container: golang:1.26-bookworm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-post-merge
          path: build/coverage

      - name: Enforce coverage floor
        run: |
          total="$(go tool cover -func=build/coverage/coverage.out | awk '/^total:/{gsub(/%/,"",$NF); print $NF}')"
          echo "Total coverage: ${total}%"
          awk -v total="${total}" -v floor=85 'BEGIN {
            if (total < floor) {
              printf "FAIL: coverage %.1f%% is below the %.1f%% floor\n", total, floor
              exit 1
            }
            printf "PASS: coverage %.1f%% meets the %.1f%% floor\n", total, floor
          }'