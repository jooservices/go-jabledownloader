# Dedicated CI for jooservices/go-jabledownloader — GitHub-hosted runners
# Post-merge sanity run on master/develop heads. Full gate lives in ci.yml (pull requests).
name: CI post-merge

on:
  push:
    branches: [master, develop]

concurrency:
  group: ci-post-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Cache Go caches
        uses: actions/cache@v6
        id: go-cache
        with:
          path: .cache
          key: go-cache-v2-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-v2-

      - name: Download modules
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm go go mod download

      - name: Format check
        run: tools/ci/docker-compose run --rm go make fmt-check

      - name: Module integrity
        run: tools/ci/docker-compose run --rm go go mod verify

  test:
    name: Test
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Cache Go caches
        uses: actions/cache@v6
        id: go-cache
        with:
          path: .cache
          key: go-cache-v2-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-v2-

      - name: Download modules
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm go go mod download

      - name: Run tests with coverage
        run: tools/ci/docker-compose run --rm go go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-post-merge
          path: coverage.out
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-post-merge
          path: build/coverage

      - name: Build CI image
        run: tools/ci/docker-compose build go

      - name: Enforce coverage floor
        run: |
          total="$(tools/ci/docker-compose run --rm go sh -c 'go tool cover -func=build/coverage/coverage.out' | awk '/^total:/{gsub(/%/,"",$NF); print $NF}')"
          echo "Total coverage: ${total}%"
          # Coverage floor: 85% total (go tool cover -func).
          awk -v total="${total}" -v floor=85 'BEGIN {
            if (total < floor) {
              printf "FAIL: coverage %.1f%% is below the %.1f%% floor\n", total, floor
              exit 1
            }
            printf "PASS: coverage %.1f%% meets the %.1f%% floor\n", total, floor
          }'

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/coverage.out
          fail_ci_if_error: true
          verbose: true

      - name: Resolve SonarQube host URL
        id: sonar-config
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host_url="${host_url%/}"
          case "${host_url}" in
            http://*|https://*) ;;
            *) host_url="https://${host_url}" ;;
          esac
          if [[ ! "${host_url}" =~ ^https?://[^[:space:]/]+ ]]; then
            echo "SONAR_HOST_URL must be a valid HTTP(S) URL"
            exit 1
          fi
          echo "host_url=${host_url}" >> "${GITHUB_OUTPUT}"

      - name: Upload SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-config.outputs.host_url }}
        with:
          args: >
            -Dsonar.go.coverage.reportPaths=build/coverage/coverage.out
