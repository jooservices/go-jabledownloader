name: Repair workspace permissions
description: Reclaim self-hosted runner1 workspaces from legacy root-owned Docker artifacts.

runs:
  using: composite
  steps:
    - name: Repair workspace and runner temp
      shell: bash
      run: |
        set -euo pipefail

        runner_uid="$(id -u)"
        runner_gid="$(id -g)"

        if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}" ]; then
          echo "Reclaiming ${RUNNER_WORKSPACE} ..."
          sudo chown -R "${runner_uid}:${runner_gid}" "${RUNNER_WORKSPACE}"
        fi

        if [ -n "${RUNNER_WORKSPACE:-}" ]; then
          work_root="$(dirname "${RUNNER_WORKSPACE}")"
          if [ -d "${work_root}/_temp" ]; then
            echo "Reclaiming ${work_root}/_temp ..."
            sudo chown -R "${runner_uid}:${runner_gid}" "${work_root}/_temp"
            sudo rm -rf "${work_root}/_temp/pr-diff-range"
          fi
        fi
